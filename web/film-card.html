<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:3840px;height:2160px;overflow:hidden;background:white;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",Arial,sans-serif;color:#172431}.card{width:1920px;height:1080px;transform:scale(2);transform-origin:0 0;position:relative;background:#fff;padding:112px 126px}.brand{font-size:28px;font-weight:700;letter-spacing:4px;color:#2872d5;display:flex;align-items:center;gap:18px}.brand i{font-style:normal;letter-spacing:-5px;font-size:47px;background:#edf4ff;width:66px;height:66px;border-radius:17px;display:grid;place-items:center;padding-right:7px}.eyebrow{font:15px Arial,sans-serif;letter-spacing:6px;color:#9ca9b6;margin-top:98px}.headline{font-size:99px;line-height:1.32;letter-spacing:-2px;font-weight:650;margin:29px 0 31px}.sub{font-size:23px;letter-spacing:1px;color:#8293a3;line-height:1.8}.tag{display:inline-block;background:#eef5ff;color:#417cc8;border-radius:30px;padding:11px 22px;font-size:15px;margin-top:35px}.footer{position:absolute;bottom:85px;left:126px;right:126px;border-top:1px solid #edf1f5;padding-top:24px;font:12px Arial,sans-serif;letter-spacing:2px;color:#b1bac3;display:flex;justify-content:space-between}.cursor-group{position:absolute;left:1220px;top:350px;width:500px;height:430px}.pointer{position:absolute;filter:drop-shadow(0 7px 10px #23384a15)}.pointer svg{display:block;width:58px;height:74px}.pointer span{display:inline-block;font-size:13px;background:var(--c);color:white;padding:7px 12px;border-radius:6px;position:absolute;left:43px;top:52px;white-space:nowrap}.p0{left:30px;top:30px;transform:rotate(-9deg)}.p1{left:252px;top:45px;transform:rotate(12deg)}.p2{left:133px;top:187px;transform:rotate(-2deg)}.p3{left:330px;top:265px;transform:rotate(15deg)}.p4{left:5px;top:324px;transform:rotate(-14deg)}.gridmark{position:absolute;left:1180px;top:280px;width:540px;height:540px;background-image:radial-gradient(#dfe8f1 1.2px,transparent 1.2px);background-size:24px 24px;mask-image:radial-gradient(ellipse,black,transparent 70%)}
</style></head><body><div class="card"><div class="brand"><i>mi</i> MULTI INPUT</div><div class="eyebrow" id="eyebrow">ONE AI. MANY INPUTS.</div><h1 class="headline" id="headline">一份答案。<br>多处完成。</h1><div class="sub" id="sub">让输入摆脱逐次等待。</div><div class="tag" id="tag">文档 × 表格 × 多种控件</div><div class="gridmark"></div><div class="cursor-group" id="pointers"></div><div class="footer"><span>ONE PLAN / MULTIPLE INPUT CHANNELS</span><span>LOCAL INTERACTIVE DEMO</span></div></div><script>
const colors=['#3578e5','#da6d42','#8f62c4','#279978','#d35d89'];document.getElementById('pointers').innerHTML=colors.map((c,i)=>`<div class="pointer p${i}" style="--c:${c}"><svg viewBox="0 0 30 39"><path d="M3 2L3 31L11 23L17 37L23 34L17 21L28 21Z" fill="${c}" stroke="white" stroke-width="1.8"/></svg><span>AI · 0${i+1}</span></div>`).join('');
window.setCard=function(type){if(type==='outro'){document.getElementById('headline').innerHTML='文档、表格。<br>一批完成。';document.getElementById('sub').textContent='单选 · 多选 · 下拉 · 文本 · 日期 · 数字';document.getElementById('tag').textContent='一个 AI，自主编排输入通道';document.getElementById('eyebrow').textContent='BATCH. STAGGER. COMPLETE.';}};
</script></body></html>
