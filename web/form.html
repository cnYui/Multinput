<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>批量表单 · 10 道题</title><style>
*{box-sizing:border-box}body{margin:0;background:#191e22;color:#e9ede6;font:12px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;padding:12px 24px}.intro{display:flex;justify-content:space-between;color:#89999d;font-size:10px;margin-bottom:8px}.intro b{color:#66e0c2;font-weight:400}form{display:grid;gap:5px}.question{display:grid;grid-template-columns:27px 205px 1fr 310px;align-items:center;gap:12px;min-height:28px}.num{color:#5c737a;font:11px ui-monospace,monospace}.prompt{font-size:11px}.choices{display:flex;gap:10px}.choice{border:1px solid #3e494f;border-radius:4px;padding:4px 10px;display:flex;align-items:center;gap:5px;color:#aab7ba;font-size:10px;cursor:pointer}.choice:has(input:checked){background:#263f36;border-color:#66e0c2;color:#8cead0}.choice input{accent-color:#66e0c2;width:11px;height:11px;margin:0}.note{width:100%;border:1px solid #39464d;background:#151a1e;color:#c8e5dc;border-radius:4px;padding:6px 9px;font:10px -apple-system,sans-serif;height:27px}.note:not(:placeholder-shown){border-color:#577b6d}.mi-cursor{position:absolute;z-index:99;pointer-events:none;color:var(--c)}.mi-arrow{font-size:20px;line-height:18px;text-shadow:0 1px 3px #000}.mi-tag{font-size:8px;display:inline-block;background:var(--c);color:#10251b;border-radius:2px;padding:1px 4px;white-space:nowrap;vertical-align:top;margin:9px 0 0 -3px}.mi-cursor.done{opacity:.8}.header-row{display:grid;grid-template-columns:27px 205px 1fr 310px;gap:12px;color:#68828b;font-size:8px;letter-spacing:1px;margin-bottom:6px}.saving{color:#6ee1c4}@media(max-width:850px){.question,.header-row{grid-template-columns:20px 155px 1fr 220px;gap:8px}.choice{padding:4px 6px}.choices{gap:5px}}
form{gap:4px}.question{min-height:26px}.note{height:25px}.choice{padding-top:3px;padding-bottom:3px}
</style></head><body data-kind="form"><div class="intro"><span>INDEPENDENT FIELDS / 10 QUESTIONS</span><b id="summary">0 / 20 已填写</b></div><div class="header-row"><span>#</span><span>问题</span><span>单选答案</span><span>文本说明</span></div><form id="questionnaire"></form><div id="overlays" data-mi-overlay></div><script>
const prompts=['交互方式','执行通道','任务拆分','观察来源','输入方式','文档定位','冲突处理','状态反馈','验证方式','决策来源'];
document.getElementById('questionnaire').innerHTML=prompts.map((p,i)=>`<div class="question"><span class="num">${String(i+1).padStart(2,'0')}</span><span class="prompt">${p}：请选择方案</span><div class="choices">${['A','B','C','D'].map(x=>`<label class="choice"><input id="q${i+1}-${x}" type="radio" name="q${i+1}" value="${x}" aria-label="第${i+1}题选项${x}">${x}</label>`).join('')}</div><input class="note" id="note${i+1}" name="note${i+1}" aria-label="第${i+1}题说明" placeholder="等待批量文本输入"></div>`).join('');
</script><script src="/surface.js"></script></body></html>
